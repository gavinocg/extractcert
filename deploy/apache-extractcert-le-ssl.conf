<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName extractcert.rpcayambe.gob.ec
    ProxyPreserveHost On
    RequestReadTimeout handshake=5 header=10-20,MinRate=500 body=10,MinRate=500

    ProxyPass /hooks/deploy http://127.0.0.1:9000/hooks/deploy
    ProxyPassReverse /hooks/deploy http://127.0.0.1:9000/hooks/deploy
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    <Location />
        Require all granted
    </Location>
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>
    <Location /hooks/deploy>
        Require all granted
        LimitRequestBody 1048576
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/extractcert_error.log
    CustomLog ${APACHE_LOG_DIR}/extractcert_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/extractcert.rpcayambe.gob.ec/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/extractcert.rpcayambe.gob.ec/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
