# Sitio nuevo e independiente: NO modifica los sites existentes.
# Copiar a /etc/nginx/sites-available/extractcert y enlazar en sites-enabled.
# Cambiar __DOMINIO__ por el dominio/subdominio real y __PUERTO__ si el 8000 está ocupado.

upstream extractcert_app {
    server 127.0.0.1:__PUERTO__;
    keepalive 16;
}

server {
    listen 80;
    server_name __DOMINIO__;

    client_max_body_size 100m;

    location / {
        proxy_pass http://extractcert_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
